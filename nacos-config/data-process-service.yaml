spring:
  datasource:
    driver-class-name: com.kingbase8.Driver
    url: jdbc:kingbase8://localhost:54321/data_processing
    username: system
    password: 123456
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms
# 当前UDP遥测处理主流程的RocketMQ连接和生产者配置。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: telemetry
    send-message-timeout: 5000
    access-key:
    secret-key:

# 文件对象存储连接配置。
minio:
  endpoint: http://127.0.0.1:9002
  public-url: http://127.0.0.1:9002
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: fep-files

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true


system-monitor:
  # 处理服务心跳写入间隔，单位毫秒；多个实例共用心跳键。
  process-heartbeat-interval-millis: 5000
  # 心跳键过期时间，单位毫秒，必须大于写入间隔。
  process-heartbeat-expiry-millis: 30000
  snapshot-retention-days: 7
  cpu-warning-percent: 85
  memory-warning-percent: 90
  disk-warning-percent: 85
  queue-warning-depth: 1000

# IoTDB 客户端版本应与服务端版本保持一致；未配置时默认不写入。
iotdb:
  # 是否启用IoTDB连接和数据写入；关闭后其他处理流程继续运行。
  enabled: true
  host: 127.0.0.1
  port: 6667
  username: root
  password: root
  max-pool-size: 5

# 数据采集接口和数据处理公共配置。
data-processing:
  # UDP采集线程池固定线程数，超过该数量的接口会明确启动失败。
  collect-thread-count: 32
  # 遥测数据处理线程池固定线程数。
  process-thread-count: 64
  # 数据处理线程池等待队列容量。
  process-queue-capacity: 2048
  # 遥测结果异步处理配置，入库与消息任务各自排队，不占用处理线程。
  result:
    # IoTDB入库固定线程数，应结合连接池大小调整。
    storage-thread-count: 4
    # IoTDB待入库任务上限，队列满时记录告警并拒绝任务。
    storage-queue-capacity: 2048
    # RocketMQ发送固定线程数。
    message-thread-count: 4
    # RocketMQ待发送任务上限，队列满时记录告警并拒绝任务。
    message-queue-capacity: 2048
    # 服务关闭时两个线程池共享的最大等待时间，单位秒。
    shutdown-wait-seconds: 30
  # 每秒把采集和处理增量写入Redis实时统计。
  statistics-sample-millis: 1000
  # 每五秒把已经结束的Redis统计窗口写入数据库。
  statistics-flush-millis: 5000
  # 当前主流程只向该RocketMQ主题发布最终遥测结果。
  mq:
    result-topic: topic_pdxp_test
    result-tag:
    # 文件接收完成后发送文件地址和基础信息的主题。
    file-topic: topic_fep_file
    file-tag: fep-file
  # 文件交换接收使用的系统级配置，不读取协议配置表。
  fep:
    # 相对路径以数据处理服务启动目录为基准，每个接口会创建独立子目录。
    temp-directory: data/fep/temp
    # 纸质协议约定的最大数据单元长度。
    data-unit-length: 4096
    # MinIO上传和文件消息发布使用的固定线程数。
    result-thread-count: 4
    # 文件结果任务等待队列容量。
    result-queue-capacity: 256
    # 扫描未完成文件记录的间隔，单位为毫秒。
    retry-interval-millis: 10000
    # 每次扫描最多提交的文件数量。
    retry-batch-size: 100
  # 遥测处理RPC客户端连接配置。
  rpc:
    # RPC服务地址由Nacos统一配置。
    host: 10.126.100.37
    # tm.proto对应服务的默认监听端口。
    port: 50051
    # 单帧RPC调用的最大等待时间。
    timeout-millis: 5000

# 野值检测的实时样本缓存和野值详情批量落库配置。
calibration:
  # 每五秒把缓存队列中的野值详情批量写入数据库。
  persistence-interval-millis: 5000
  # 单次落库最多处理的野值详情数量。
  persistence-batch-size: 500
  # 校准算法有效样本缓存保留天数。
  effective-cache-days: 7
# 基线卫星目录查询与管理服务角色查询使用相同根地址。
baseline:
  sso:
    api-base-url: http://10.126.100.249:16001/prod-api
    connect-timeout-millis: 5000
    read-timeout-millis: 10000
