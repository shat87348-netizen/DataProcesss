spring:
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.kingbase8.Driver
    url: jdbc:kingbase8://localhost:54321/data_processing
    username: system
    password: 123456
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: select 1
      keepalive-time: 60000
      idle-timeout: 300000
      max-lifetime: 600000
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 3000ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.dataadmin.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

pagehelper:
  # KingbaseES 的分页语法与 PostgreSQL 兼容。
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: false

auth:
  # 允许任意前端来源跨域访问，由现有跨域过滤器处理预检请求。
  allowed-origin-patterns:
    - "*"
  # 开发环境临时关闭登录和权限校验，生产环境必须设为 true。
  enabled: true
  # 生产环境必须在 Nacos 中替换为长度足够的随机密钥。
  jwt-secret: data-processing-local-development-secret-change-me
  # 登录令牌和Redis会话有效期，单位秒；0表示永不过期。
  expire-seconds: 0
  exclude-paths:
    - /auth/login
    - /auth/sso/login
    - /integration/menu-config
    - /ws/**
    - /v3/api-docs/**
    - /swagger-ui.html
    - /swagger-ui/**

# 基线平台统一登录接口配置。
baseline:
  sso:
    # 需要替换为部署环境的基线平台内部接口根地址，可以包含/prod-api前缀。
    api-base-url: http://10.126.100.249:16001/prod-api
    # 需要替换为基线平台分配给数据交互子系统的客户端编号。
    client-id:
    connect-timeout-millis: 5000
    read-timeout-millis: 10000

# 子系统嵌套集成配置。
subsystem:
  integration:
    # 子系统唯一标识，供外部宿主系统定位当前子系统。
    system-key: data-processing
    # 子系统在外部宿主系统中显示的名称。
    label: 数据处理系统
    # 子系统图标标识，使用本系统约定的图标名称。
    icon: i-lucide-network
    # 填写当前环境可供外部系统访问的前端根地址，不包含末尾斜线。
    base-url: http://10.126.100.61:3000
    # 外部宿主系统首次打开本系统时使用的默认页面路径。
    default-path: /dashboard

# 向交互系统定时上报当前系统心跳的配置。
interaction:
  heartbeat:
    # 是否开启心跳上报：true开启，false关闭，默认开启。
    enabled: false
    # 交互系统接口协议。
    scheme: http
    # 交互系统服务IP。
    host: 10.126.100.247
    # 交互系统服务端口。
    port: 8063
    # 交互系统部署上下文路径。
    context-path: /inst2
    # 心跳上报接口路径。
    report-path: /wjp-admin/kzt/status/report
    # 当前数据处理软件在交互系统中的系统标识。
    system-id: sjcl
    # 心跳上报间隔，单位毫秒
    interval-millis: 60000
    # 心跳接口连接超时时间，单位毫秒。
    connect-timeout-millis: 5000
    # 心跳接口响应读取超时时间，单位毫秒。
    read-timeout-millis: 10000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

# 调度系统任务生命周期消息接收配置。
rocketmq:
  name-server: "10.126.100.201:9876;10.126.100.201:10876;10.126.100.201:11876;10.126.100.201:12876;10.126.100.201:13876;10.126.100.201:14876"
  consumer:
    # 填写有效的消费认证信息。
    access-key: SJCLMQ
    secret-key: SJCLMQ123
task-lifecycle:
  # 调度系统发布任务生命周期消息的主题。
  topic: sydu-events
  # 同时订阅任务开始和任务结束标签。
  selector-expression: "experiment.task.start||experiment.task.end"
  # 本系统任务生命周期消费者组。
  consumer-group: data-processing-task-lifecycle

system-monitor:
  # 处理服务心跳正常判断时限，单位毫秒，应大于处理服务写入间隔。
  process-heartbeat-timeout-millis: 15000
  # CPU 使用率告警阈值，单位：百分比。
  cpu-warning-percent: 85
  # 内存使用率告警阈值，单位：百分比。
  memory-warning-percent: 90
  # 磁盘使用率告警阈值，单位：百分比。
  disk-warning-percent: 85
  # 消息队列积压数量告警阈值，单位：条。
  queue-warning-depth: 1000

# 当前数据处理结果主题的RocketMQ积压监控配置。
rocketmq-monitor:
  name-server: "10.126.100.201:9876;10.126.100.201:10876;10.126.100.201:11876;10.126.100.201:12876;10.126.100.201:13876;10.126.100.201:14876"
  topic: topic_yc_out_sjcl
  # 必须配置实际下游消费者组，否则无法计算消费积压量。
  consumer-group:
  access-key: SJCLMQ
  secret-key: SJCLMQ123

iotdb:
  host: 127.0.0.1
  port: 6667
  username: root
  password: root
  # 管理服务IoTDB连接上限；处理后参数查询线程数自动比此值少一个，至少配置为2。
  max-pool-size: 40

# 卫星目录管理服务的gRPC客户端连接配置。
satellite-management:
  rpc:
    host: 10.126.100.37
    port: 50051
    timeout-millis: 5000
    max-inbound-message-size: 16777216
    max-upload-file-size: 16777216

# 管理服务在采集接口配置提交后通知数据处理服务同步运行任务。
data-processing:
  # HTTP完整接收地址的访问协议，反向代理使用HTTPS时修改为https；配置管理不创建监听端口。
  http:
    scheme: http
  interface-sync-url: http://127.0.0.1:8083/internal/collection/interfaces/sync
  # 内部接口连接超时时间，单位毫秒。
  interface-sync-connect-timeout-millis: 5000
  # 内部接口响应读取超时时间，单位毫秒。
  interface-sync-read-timeout-millis: 10000

# 业务数据过期删除配置；不填或留空不删除，填写正整数时按天保留。
# 每小时第15分钟分批物理删除；变更后重启管理服务生效，采集处理累计数量按剩余记录计算。
data-retention:
  # 采集五秒统计及采集曲线保留天数。
  collection-statistics-days: 30
  # 处理五秒统计及处理曲线保留天数。
  processing-statistics-days: 30
  # CPU、内存、磁盘等系统资源快照保留天数。
  system-monitor-days: 30
  # 日志管理中的操作日志保留天数。
  operation-log-days: 30
  # 数据告警保留天数，以首次告警时间为准，包含已处理和未处理记录。
  data-alarm-days: 30
  # 系统告警保留天数，以告警时间为准，包含活动和已恢复记录。
  system-alarm-days: 30
  # 野值详情保留天数，以发生时间为准；汇总记录和历史累计野值数保持不变。
  calibration-days: 30
  # 文件和图片数据库记录保留天数，以接收完成时间为准；不删除MinIO对象。
  file-record-days: 30

# 图片和文件查询的临时签名配置，账号和存储桶与处理服务保持一致。
minio:
  # 必须为浏览器可达的对象存储API根地址；当前示例为本开发机局域网地址，部署时替换。
  public-url: http://10.126.100.107:9002
  # 签名账号仅供后端使用，不返回前端。
  access-key: minioadmin
  # 签名密码仅供后端使用，不返回前端。
  secret-key: minioadmin123
  # 必须与处理服务上传文件使用的桶一致。
  bucket-name: fep-files
  # 必须与MinIO实际区域一致，未单独设置时通常为us-east-1，签名无需在线查询区域。
  region: us-east-1
  # 临时地址有效期，单位秒，允许1至604800；默认一小时。
  url-expiry-seconds: 3600
