  /collection/interfaces/update:
    post:
      tags: [数据采集]
      summary: 修改采集接口
      description: 'taskId必须与采集接口原所属试验任务编号一致，修改任务编号返回参数错误；累计采集量不会因编辑接口而清零。HTTP（transferType=3）固定JSON（transferProtocol=1），必选当前任务下已启用的JSON类型协议配置，receivePath必填；允许共用host、port，路径在所有未删除HTTP配置中唯一，禁用记录也保留路径。HTTP固定rpcEnabled=0、multicastIp=null。FEP（transferProtocol=3）省略rpcEnabled和protocolConfigId，固定保存0和null。其他协议处理选PDXP、转发选RPC。其他传输方式保存时清空receivePath。UDP/TCP按既有启用监听配置校验冲突。HTTP另有统一接收入口，当前仅确认收到JSON，不查询配置、不处理业务、不入库、不统计。'
