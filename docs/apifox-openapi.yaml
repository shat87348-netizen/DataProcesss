            timePoints:
              type: array
              description: "统计区间结束时间，与values按下标对应；3h共36点、24h共48点、7d共42点。历史点为HH:mm，7d为MM-dd HH:mm；最新滚动点分别为HH:mm:ss和MM-dd HH:mm:ss。"
              items: { type: string }
            latestWindowStartTime:
              type: string
              description: "最新滚动点的统计起点，包含此时刻；使用完整本地时间，不附带时区。3h、24h、7d分别覆盖5分钟、30分钟、4小时。"
              example: "2026-09-09T10:24:50"
            latestWindowEndTime:
              type: string
              description: "最新滚动点的统计截止时间，不包含此时刻；当前时间减10秒再向下对齐5秒，使用完整本地时间，不附带时区。缓冲仅覆盖正常落库延迟，不保证故障积压已经写完。"
              example: "2026-09-09T10:29:50"
            series:
              type: array
              description: "各发送方系统的处理量曲线"
              items:
                type: object
                properties:
                  systemName: { type: string, description: "发送方系统名称" }
                  values:
                    type: array
                    description: "各区间累计的处理条数；最后一个值为完整跨度的滚动统计，与历史区间可能重叠，不能累加作为总量。无数据区间返回0；PDXP以业务处理完成且两个异步结果任务均提交成功为准。"
                    items: { type: integer, format: int64 }
        table:
          type: array
          description: "按发送方系统聚合的处理明细"
          items:
            type: object
            properties:
              systemName: { type: string, description: "发送方系统名称" }
              processedCount: { type: integer, format: int64, description: "统计时间范围内处理完成的数据条数；PDXP以业务处理完成且两个异步结果任务均提交成功为准" }
              deduplicatedCount: { type: integer, format: int64, description: "统计时间范围内被后值覆盖的重复遥测参数数量" }
              abnormalCount: { type: integer, format: int64, description: "统计时间范围内判定为野值的遥测参数数量" }

    FepFileMessage:
      type: object
      description: "FEP文件接收完成并上传对象存储后发送到消息队列的内容"
      properties:
        requirementId: { type: string, description: "需求编号；当前未知时为空字符串" }
        requirementName: { type: string, description: "需求名称；当前未知时为空字符串" }
        requirementDesc: { type: string, description: "需求描述；当前未知时为空字符串" }
        version: { type: string, description: "需求版本；当前未知时为空字符串" }
        fileUrl: { type: string, description: "对象存储文件访问地址" }
        fileType: { type: string, nullable: true, description: "原始文件的小写后缀，不包含点号；没有有效后缀时为空" }
        baseInfo:
