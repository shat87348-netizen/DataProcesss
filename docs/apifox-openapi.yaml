  /alarms/data:
    get:
      tags:
      - 告警管理
      summary: 查询数据监测告警
      description: 告警由后台采集、处理、校准自动录入，不提供人工创建、内容修改和删除接口，支持人工修改处理状态。支持来源、关键字、级别、状态和告警时间范围组合筛选。关键字匹配来源、告警信息、任务名称、通道编码和触发规则。 来源参数使用sourceCode英文编码，中文来源名称通过sourceName返回；来源中文关键字仍可使用keyword匹配。
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: sourceCode
        in: query
        description: 来源英文编码，使用/alarms/findData中dataAlarmSource的value精确匹配；不接受中文名称
        schema:
          type: string
          enum:
          - COLLECTION
          - PROCESSING
          - CALIBRATION
          x-apifox-enum:
          - value: COLLECTION
            label: 数据采集
          - value: PROCESSING
            label: 数据处理
          - value: CALIBRATION
            label: 数据校准
      - name: keyword
        in: query
        description: 关键字，模糊匹配来源、告警信息、任务名称、通道编码和触发规则
        schema:
          type: string
      - name: alarmLevel
        in: query
        description: 数据监测告警级别：2一般、4严重
        schema:
          type: integer
          enum:
          - 2
          - 4
          x-apifox-enum:
          - value: 2
            label: 一般
          - value: 4
            label: 严重
      - name: alarmStatus
        in: query
        description: 处理状态：0未处理 1已处理
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: startTime
        in: query
        description: 告警开始时间，包含该时间
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        description: 告警结束时间，包含该时间
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PageNum'
      - $ref: '#/components/parameters/PageSize20'
      responses:
        '200':
          $ref: '#/components/responses/Success073'

  /alarms/data/{id}:
    get:
      tags: [告警管理]
      summary: 查询数据监测告警详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success074'

  /alarms/data/status:
    post:
      tags: [告警管理]
      summary: 修改数据监测告警人工处理状态
      description: 人工处理状态为0未处理、1已处理；只改变alarmStatus，不改变告警内容或后台自动恢复时间recoverTime。该操作记录到系统操作日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: "业务数据主键 ID"
                  format: int64
                status:
                  type: integer
                  description: "人工处理状态。枚举：0 未处理，1 已处理"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "未处理"
                      description: "0 表示未处理"
                    - value: 1
                      name: "已处理"
                      description: "1 表示已处理"
            example:
              id: 131
              status: 1
      responses:
        '200':
          $ref: '#/components/responses/Success078'

  /alarms/system:
    get:
      tags:
      - 告警管理
      summary: 查询系统告警
      responses:
        '200':
          $ref: '#/components/responses/Success079'
      description: 唯一系统告警查询入口，后台自动写入sys_alarm_event；不开放创建、修改、删除或人工恢复接口。
      parameters:
      - name: status
        in: query
        required: false
        description: 自动恢复状态，为空返回全部
        schema:
          type: integer
          description: 恢复状态
          enum:
          - 0
          - 1
          x-apifox-enum:
          - value: 0
            label: 未恢复
          - value: 1
            label: 已恢复

  /alarms/system-monitor/current:
    get:
      tags: [告警管理]
      summary: 查询当前系统健康状态
      responses:
        '200':
          $ref: '#/components/responses/Success080'

  /alarms/system-monitor/history:
    get:
      tags: [告警管理]
      summary: 查询系统健康趋势
      parameters:
        - name: minutes
          description: "查询最近多少分钟的系统状态，至少1分钟；返回仍保留的快照，保留天数由data-retention.system-monitor-days控制，留空不自动清理"
          in: query
          schema: { type: integer, default: 60 }
      responses:
        '200':
          $ref: '#/components/responses/Success081'

  /system/logs:
    get:
      tags:
      - 系统日志
      summary: 组合筛选并分页查询系统运行日志
      description: 日志级别枚举为INFO信息、WARN警告、ERROR错误。操作人、日志内容和详情支持模糊匹配，时间范围包含起止时间。
      parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: logLevel
        in: query
        description: 日志级别：INFO信息 WARN警告 ERROR错误
        schema:
          type: string
          enum:
          - INFO
          - WARN
          - ERROR
          x-apifox-enum:
          - value: INFO
            name: 信息
            description: INFO表示普通运行信息
          - value: WARN
            name: 警告
            description: WARN表示运行警告
          - value: ERROR
            name: 错误
            description: ERROR表示运行错误
      - name: logSource
        in: query
        description: 日志来源英文编码，使用/system/logs/findData中logSource的value精确匹配；不接受中文名称
        schema:
          type: string
          enum:
          - COLLECTION
          - PROCESSING
          - CALIBRATION
          - VISUALIZATION
          - TELEMETRY_FILTER
          - ALARM_MANAGEMENT
          - USER_MANAGEMENT
          - ROLE_MANAGEMENT
          - SATELLITE_CATALOG
          - AUTHENTICATION
          x-apifox-enum: &id001
          - value: COLLECTION
            label: 数据采集
          - value: PROCESSING
            label: 数据处理
          - value: CALIBRATION
            label: 数据校准
          - value: VISUALIZATION
            label: 数据可视化
          - value: TELEMETRY_FILTER
            label: 遥测参数筛选
          - value: ALARM_MANAGEMENT
            label: 告警管理
          - value: USER_MANAGEMENT
            label: 用户管理
          - value: ROLE_MANAGEMENT
            label: 角色管理
          - value: SATELLITE_CATALOG
            label: 卫星目录
          - value: AUTHENTICATION
            label: 用户认证
      - name: operatorId
        in: query
        description: 操作人标识，模糊匹配
        schema:
          type: string
      - name: keyword
        in: query
        description: 关键字，模糊匹配日志内容和详情
        schema:
          type: string
      - name: startTime
        in: query
        description: 开始时间，包含该时间
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        description: 结束时间，包含该时间
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PageNum'
      - $ref: '#/components/parameters/PageSize20'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      pageNum:
                        type: integer
                      pageSize:
                        type: integer
                      total:
                        type: integer
                        format: int64
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              format: int64
                            taskId:
                              type: string
                            logTime:
                              type: string
                              format: date-time
                            logLevel:
                              type: string
                              enum:
                              - INFO
                              - WARN
                              - ERROR
                              description: 日志级别：INFO信息 WARN警告 ERROR错误
                            logLevelName:
                              type: string
                              description: 日志级别中文名称：信息、警告或错误
                            logSource:
                              type: string
                              description: 日志来源英文编码
                              enum:
                              - COLLECTION
                              - PROCESSING
                              - CALIBRATION
                              - VISUALIZATION
                              - TELEMETRY_FILTER
                              - ALARM_MANAGEMENT
                              - USER_MANAGEMENT
                              - ROLE_MANAGEMENT
                              - SATELLITE_CATALOG
                              - AUTHENTICATION
                              x-apifox-enum: *id001
                            operatorId:
                              type: string
                              description: 操作人标识
                            logContent:
                              type: string
                              description: 日志内容
                            logDetail:
                              type: string
                              description: 日志完整详情
                            logSourceName:
                              type: string
                              nullable: true
                              description: 来源中文名称，由日志来源枚举的label生成，仅用于展示
              example:
                code: 200
                message: 操作成功
                data:
                  pageNum: 1
                  pageSize: 20
                  total: 1
                  records:
                  - id: 201
                    taskId: TASK-20260908-001
                    logTime: '2026-08-06T14:39:14'
                    logLevel: ERROR
                    logLevelName: 错误
                    logSource: COLLECTION
                    operatorId: admin
                    logContent: 创建采集接口失败
                    logDetail: 操作人：admin；接口名称：遥测接收接口；接口ID：101；结果：创建失败；原因：后台异常
                    logSourceName: 数据采集

  /system/logs/{id}:
