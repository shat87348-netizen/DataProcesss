      summary: 新增校准通道
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  type: string
                  description: "外部试验任务编号"
                channelName:
                  type: string
                  description: "校准通道名称"
                calibrationFormula:
                  type: string
                  description: "校准公式"
                normalRange:
                  nullable: true
                  type: string
                  description: "正常数值范围，仅阈值法必填；其他算法可不填，填写时校验格式；修改时不传保留原值，非阈值法传空字符串可清空"
                detectMethod:
                  type: integer
                  description: "野值检测方法：1莱特准则 2阈值法 3肖维涅法。枚举：1 莱特准则，2 阈值法，3 肖维涅法"
                  enum:
                    - 1
                    - 2
                    - 3
                  x-apifox-enum:
                    - value: 1
                      name: "莱特准则"
                      description: "1 表示莱特准则"
                    - value: 2
                      name: "阈值法"
                      description: "2 表示阈值法"
                    - value: 3
                      name: "肖维涅法"
                      description: "3 表示肖维涅法"
                sigmaValue:
                  type: integer
                  description: "莱特准则使用的σ倍数，取值1至5"
                fluctuationRate:
                  type: number
                  description: "阈值法使用的阈值百分比，大于0且不超过100"
                  format: double
                chauvenetCoef:
                  type: number
                  description: "肖维涅法判别常数，固定为0.5"
                  format: double
                minSampleCount:
                  type: integer
                  description: "肖维涅法参与计算的最近样本数，不小于3"
                iterateCount:
                  type: integer
                  description: "肖维涅法迭代次数，取值1至3"
                sampleWindow:
                  type: integer
                  description: "莱特准则使用的最近样本窗口，不小于3"
                dynamicUpdate:
                  type: integer
                  description: "是否动态更新：0否 1是。枚举：0 否，1 是"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "否"
                      description: "0 表示否"
                    - value: 1
                      name: "是"
                      description: "1 表示是"
                autoClean:
                  type: integer
                  description: "是否自动排除异常值：0否 1是。枚举：0 否，1 是"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "否"
                      description: "0 表示否"
                    - value: 1
                      name: "是"
                      description: "1 表示是"
                enabled:
                  type: integer
                  description: "是否启用通道：0否 1是。枚举：0 禁用，1 启用"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "禁用"
                      description: "0 表示禁用"
                    - value: 1
                      name: "启用"
                      description: "1 表示启用"
            example:
              taskId: "TASK-20260908-001"
              channelName: "温度通道1"
              calibrationFormula: "CH01"
              normalRange: "-20~80"
              detectMethod: 3
              sigmaValue: 3
              fluctuationRate: 10
              chauvenetCoef: 0.5
              minSampleCount: 10
              iterateCount: 1
              sampleWindow: 100
              dynamicUpdate: 1
              autoClean: 1
              enabled: 1
      responses:
        '200':
          $ref: '#/components/responses/Success063'

