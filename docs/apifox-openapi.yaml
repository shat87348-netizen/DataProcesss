    DashboardCollectionData:
      type: object
      description: "数据采集总览数据"
      properties:
        taskId:
          type: string
          nullable: true
          description: "外部试验任务编号；未传查询参数时为空并统计全部任务"
        range:
          type: string
          description: "统计时间范围"
          enum: [3h, 24h, 7d]
          x-apifox-enum:
            - { value: "3h", name: "近3小时", description: "统计近3小时数据" }
            - { value: "24h", name: "近24小时", description: "统计近24小时数据" }
            - { value: "7d", name: "近7天", description: "统计近7天数据" }
        sampleTime:
          type: string
          nullable: true
          description: "Redis实时采集指标的最后更新时间；暂无实时数据时为空"
          example: "2026-08-27T10:30:01"
        summary:
          type: object
          description: "数据采集汇总卡片"
          properties:
            onlineAgentCount: { type: integer, format: int64, description: "当前在线采集接口数量" }
            senderCount: { type: integer, format: int64, description: "发送方系统总数" }
            collectionCount: { type: integer, format: int64, description: "统计时间范围内的采集总条数" }
            interfaceRateKbps: { type: number, format: double, description: "各采集接口最新接口流量之和，单位KB/s" }
        lineChart:
          type: object
          description: "按发送方系统聚合的采集量时间曲线"
          properties:
            timePoints:
              type: array
              description: "统计区间结束时间，与values按下标对应；3h共36点、24h共48点、7d共42点。历史点为HH:mm，7d为MM-dd HH:mm；最新滚动点分别为HH:mm:ss和MM-dd HH:mm:ss。"
              items: { type: string }
            latestWindowStartTime:
              type: string
              description: "最新滚动点的统计起点，包含此时刻；使用完整本地时间，不附带时区。3h、24h、7d分别覆盖5分钟、30分钟、4小时。"
              example: "2026-09-09T10:24:50"
            latestWindowEndTime:
              type: string
              description: "最新滚动点的统计截止时间，不包含此时刻；当前时间减10秒再向下对齐5秒，使用完整本地时间，不附带时区。缓冲仅覆盖正常落库延迟，不保证故障积压已经写完。"
              example: "2026-09-09T10:29:50"
            series:
              type: array
              description: "各发送方系统的采集量曲线"
              items:
                type: object
                properties:
                  systemName: { type: string, description: "发送方系统名称" }
                  values:
                    type: array
                    description: "各区间累计的采集条数；最后一个值为完整跨度的滚动统计，与历史区间可能重叠，不能累加作为卡片或表格总量。无数据区间返回0。"
                    items: { type: integer, format: int64 }
        table:
          type: array
          description: "按发送方系统聚合的采集明细"
          items:
            type: object
            properties:
              systemName: { type: string, description: "发送方系统名称" }
              interfaceCount: { type: integer, description: "该发送方配置的采集接口数量" }
              protocols:
                type: array
                description: "该发送方使用的传输协议中文名称集合"
                items: { type: string, example: "UDP" }
              collectionCount: { type: integer, format: int64, description: "统计时间范围内的采集条数" }
              percentage: { type: number, format: double, description: "该发送方采集量占总采集量的百分比" }
              interfaceRateKbps: { type: number, format: double, description: "该发送方所有接口最新流量之和，单位KB/s" }
              statusName:
                type: string
                description: "发送方存在启用接口时在线，全部禁用时离线"
                enum: [离线, 在线]
                x-apifox-enum:
                  - { value: "离线", name: "离线", description: "发送方接口当前离线" }
                  - { value: "在线", name: "在线", description: "发送方接口当前在线" }

