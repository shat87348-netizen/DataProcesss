                      systemName: 测控系统
                      tableIndex: '1'
                      bitWidth: '32'
                      telemetryName: 电压
                      telemetryCode: TMK1001
  /processing/rules/batch-update:
    post:
      tags: [数据处理]
      summary: 批量修改遥测参数解析配置
      description: 同一任务一次完整修改1到200条参数；每条参数可属于不同设备。系统名称按systemId生成，遥测代号变化时保留原勾选状态；任意参数校验失败则整批回滚。运行中的采集接口在下一次同步时加载修改后的解析字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, items]
              properties:
                taskId: { type: string, description: "当前试验任务编号" }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id, deviceSatelliteId, tableIndex, bitWidth, telemetryName, telemetryCode, formulaType]
                    properties:
                      id: { type: integer, format: int64, description: "参数解析配置主键" }
                      deviceSatelliteId: { type: integer, format: int64, description: "原设备卫星主键，不允许更换设备" }
                      systemId: { type: integer, format: int64, nullable: true, description: "所属系统主键；空值表示直属设备" }
                      tableIndex: { type: string, description: "大表序号，同设备内唯一" }
                      bitWidth: { type: string, description: "位宽" }
                      telemetryName: { type: string, description: "遥测名称" }
                      telemetryCode: { type: string, description: "遥测代号，同设备内唯一" }
                      formulaType: { type: string, description: "公式类型" }
                      formulaDesc: { type: string, nullable: true, description: "处理公式" }
                      processParam: { type: string, nullable: true, description: "处理参数" }
                      decimalPlaces: { type: string, nullable: true, description: "小数位数" }
                      alarmFlag: { type: string, enum: ["0", "1"], description: "是否报警：0否、1是；空值按0保存" }
                      normalValue: { type: string, nullable: true, description: "正常值范围" }
                      warningValue: { type: string, nullable: true, description: "预警值范围" }
                      stateChangeInfo: { type: string, nullable: true, description: "状态跳变信息" }
                      commandCode: { type: string, nullable: true, description: "相关命令" }
                      controlChannel: { type: string, nullable: true, description: "控制波道" }
                      mergeChannelCount: { type: string, nullable: true, description: "合并波道" }
                      delayChannel: { type: string, nullable: true, description: "延时波道" }
                      storeFlag: { type: string, enum: ["0", "1"], description: "存储遥测：0否、1是；空值按0保存" }
                      calibrationFormula: { type: string, nullable: true, description: "校准公式" }
            example:
              taskId: TASK-20260908-001
              items:
                - id: 81
                  deviceSatelliteId: 12
                  systemId: 22
                  tableIndex: '1'
                  bitWidth: '32'
                  telemetryName: 电压
                  telemetryCode: TMK1001
                  formulaType: '300'
                  formulaDesc: 'y=a*x+b'
                  processParam: '0.02/1'
                  decimalPlaces: '2'
                  alarmFlag: '1'
                  normalValue: '加电:[41,43]'
                  warningValue: null
                  stateChangeInfo: null
                  commandCode: null
                  controlChannel: null
                  mergeChannelCount: null
                  delayChannel: null
                  storeFlag: '1'
                  calibrationFormula: null
      responses:
        '200':
          description: 返回成功修改的参数条数
          content:
            application/json:
              example: { code: 200, message: 操作成功, data: 1 }

  /processing/rules/import:
    "post":
      "tags":
        - "数据处理"
      "summary": "按任务和类型导入Excel或TXT设备卫星及参数"
      "description": "按任务和类型全量导入Excel或TXT。每个Sheet沿用已有设备卫星主键；所属系统按反斜线逐层建立并写入参数systemId；仍被PDXP协议引用的设备或卫星不能从文件移除，失败时提示协议配置名称和实际设备或卫星名称；仍存在的遥测代号保留勾选状态。全部操作在同一事务中完成。"
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "required":
                - "taskId"
                - "type"
                - "file"
              "properties":
                "taskId":
                  "type": "string"
                  "description": "外部试验任务编号，所有操作必须传入"
                "type":
                  "type": "string"
                  "description": "前端选择：1卫星，2设备"
                  "enum":
                    - "1"
                    - "2"
                  "example": "1"
                "file":
                  "type": "string"
                  "description": "Excel工作簿或制表符TXT；Excel使用页签名称，TXT使用文件名作为设备卫星编码和名称"
                  "format": "binary"
      "responses":
        "200":
          "description": "操作成功"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "code":
                    "type": "integer"
                  "message":
                    "type": "string"
                  "data":
                    "type": "integer"
              "example":
                "code": 200
                "message": "操作成功"
                "data": 5
        "400":
          "description": "文件校验失败，或导入文件缺少PDXP协议配置正在使用的设备或卫星"
          "content":
            "application/json":
              "example":
                "code": 400
                "message": "导入文件缺少协议配置【遥测PDXP解析配置】正在使用的设备【设备A】"

  /calibration/overview:
    get:
      tags: [数据校准]
      summary: 查询累计校准、清洗及野值数量总览
      description: "按taskId汇总未删除校准记录，无记录时返回0。校准数量包含匹配启用通道并完成校准处理的正常值和野值，同一参数多次参与分别累计；未开启参数范围检查、未匹配通道或校准处理失败的参数不计数。数量先进入Redis队列，默认每轮落库结束后等待5秒再处理下一轮，每个队列每轮最多取500条；总览读取已落库数量，积压或重试时延迟增加。样本及详情过期清理不减少累计值。历史校准总量无法补算，从升级后开始累计。"
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "业务状态码，200表示操作成功"
                  message:
                    type: string
                    description: "业务处理结果提示信息"
                  data:
                    type: object
                    properties:
                      calibrationCount:
                        type: integer
                        format: int64
                        description: "当前试验任务累计参与校准的遥测参数数量，包含正常值和野值；历史总量不补算，从升级后开始累计"
                      cleanedCount:
                        type: integer
                        format: int64
                        description: "当前试验任务清洗数量，直接复用outlierCount，两个字段值完全一致"
                      outlierCount:
                        type: integer
                        format: int64
                        description: "当前试验任务历史累计野值数量，不随过期野值详情删除而减少"
              example:
                code: 200
                message: "操作成功"
                data:
                  calibrationCount: 10000
                  cleanedCount: 320
                  outlierCount: 320

