      summary: 查询数据采集总览（Redis实时指标与金仓历史曲线）
      description: "历史曲线点为完整固定区间，最新点滚动统计最近5分钟、30分钟或4小时；截止时间扣除10秒落库缓冲并向下对齐5秒。横轴表示区间结束时间，最新点保留秒数；最新点可与历史区间重叠，不能累加曲线值计算总量。"
