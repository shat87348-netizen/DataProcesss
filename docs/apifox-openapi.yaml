  /collection/protocols:
    get:
      tags: [数据采集]
      summary: 分页查询协议配置
      description: 按任务、协议类型和配置名称组合筛选，名称支持模糊匹配。返回data.records和分页总数；处理选择类型2（PDXP），转发选择类型4（RPC）。
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: protocolType
          in: query
          required: false
          description: "协议类型，不传时不限：1 JSON，2 PDXP，3 Protobuf，4 RPC"
          schema:
            type: integer
            enum: [1, 2, 3, 4]
          example: 4
        - name: configName
          in: query
          required: false
          description: "配置名称，按包含关系模糊匹配；空白时不筛选"
          schema:
            type: string
          example: "遥测"
        - name: pageNum
          in: query
          description: "当前页码，从1开始"
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: "每页记录数，默认10条，最大100条"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: enabled
          in: query
          required: false
          description: 协议启用状态，HTTP协议选择框传1，仅查询已启用配置
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          $ref: '#/components/responses/Success028'

