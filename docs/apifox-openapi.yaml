  /visualization/items/selected:
    post:
      tags: [数据可视化]
      summary: 修改组件数据项勾选状态
      description: 遥测参数项写入组件对应的统一勾选场景；其他数据项仍修改自身的勾选字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: "业务数据主键 ID"
                  format: int64
                status:
                  type: integer
                  description: "勾选状态：0未选中，1已选中"
                  enum:
                    - 0
                    - 1
