      summary: 分页查询采集接口
      description: '支持按接口名称包含筛选，空白名称不参与筛选；分页记录与总数使用相同条件。dataPacketCount直接读取采集接口表中的长期累计量，五秒统计明细过期删除不会使其减少；PDXP按完整帧、FEP按完整文件计数，新接口初始为0。interfaceRateKbps读取Redis最新采集速率，单位KB/s，缓存有效期5秒，缓存缺失或Redis不可用时返回0。'
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: interfaceName
          description: "采集接口名称，按包含关系筛选；首尾空格自动去除，空白时不限名称"
          in: query
          required: false
          schema:
            type: string
          example: "遥测"
        - name: interfaceType
          description: "采集接口类型。枚举：1 外部接口，2 内部接口"
          in: query
          schema:
            type: integer
            enum: [1, 2]
            x-apifox-enum:
              - value: 1
                name: "外部接口"
                description: "1 表示外部接口"
              - value: 2
                name: "内部接口"
                description: "2 表示内部接口"
        - name: transferType
          description: "数据传输方式。枚举：1 UDP，2 TCP，3 HTTP"
          in: query
          schema:
            type: integer
            enum: [1, 2, 3]
            x-apifox-enum:
              - value: 1
                name: "UDP"
                description: "1 表示 UDP 传输"
              - value: 2
                name: "TCP"
                description: "2 表示 TCP 传输"
              - value: 3
                name: "HTTP"
                description: "3 表示 HTTP 传输"
        - name: status
          description: "按启用开关筛选接口状态：0离线（禁用），1在线（启用）"
          in: query
          schema:
            type: integer
            enum: [0, 1]
            x-apifox-enum:
              - value: 0
                name: "离线"
                description: "0 表示离线"
              - value: 1
                name: "在线"
                description: "1 表示在线"
        - name: enabled
          description: "启用状态筛选条件。枚举：0 禁用，1 启用"
          in: query
          schema:
            type: integer
            enum: [0, 1]
            x-apifox-enum:
              - value: 0
                name: "禁用"
                description: "0 表示禁用"
              - value: 1
                name: "启用"
                description: "1 表示启用"
