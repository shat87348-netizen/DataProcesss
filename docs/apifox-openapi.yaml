  /collection/interfaces/enabled:
    post:
      tags: [数据采集]
      summary: 修改采集接口启用状态
      description: 'HTTP启用时复核JSON配置与接收路径，但当前通用HTTP入口不读取启用状态；UDP/TCP按既有监听配置校验冲突并同步任务。HTTP不进入套接字监听列表。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: "业务数据主键 ID"
                  format: int64
