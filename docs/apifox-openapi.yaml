          $ref: '#/components/responses/Success023'

  /collection/interfaces/create:
    post:
      tags: [数据采集]
      summary: 新增采集接口
      description: 'HTTP（transferType=3）固定JSON（transferProtocol=1），必选当前任务下已启用的JSON类型协议配置，receivePath必填；允许共用host、port，路径在所有未删除HTTP配置中唯一，禁用记录也保留路径。HTTP固定rpcEnabled=0、multicastIp=null。FEP（transferProtocol=3）省略rpcEnabled和protocolConfigId，固定保存0和null。其他协议处理选PDXP、转发选RPC。其他传输方式保存时清空receivePath。UDP/TCP按既有启用监听配置校验冲突。HTTP另有统一接收入口，当前仅确认收到JSON，不查询配置、不处理业务、不入库、不统计。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, interfaceName, interfaceType, transferType, transferProtocol, host, port]
              oneOf:
                - required: [receivePath, protocolConfigId]
                  properties:
                    transferType: { type: integer, enum: [3] }
                    transferProtocol: { type: integer, enum: [1] }
                    protocolConfigId: { type: integer, format: int64, nullable: false }
                - properties:
                    transferType: { type: integer, enum: [1, 2] }
                  oneOf:
                    - properties:
                        transferProtocol: { type: integer, enum: [3] }
                    - required: [protocolConfigId]
                      properties:
                        transferProtocol: { type: integer, enum: [1, 2] }
                        protocolConfigId: { type: integer, format: int64, nullable: false }
              properties:
                taskId:
                  type: string
                  description: "外部试验任务编号"
                interfaceName:
                  type: string
                  description: "采集接口名称"
                interfaceType:
                  type: integer
                  description: "接口类型：1外部接口 2内部接口。枚举：1 外部接口，2 内部接口"
                  enum:
                    - 1
                    - 2
                  x-apifox-enum:
                    - value: 1
                      name: "外部接口"
                      description: "1 表示外部接口"
                    - value: 2
                      name: "内部接口"
                      description: "2 表示内部接口"
                sendFrom:
                  type: string
                  description: "数据发送来源"
                messageContent:
                  type: string
                  description: "采集消息内容或格式说明"
                transferType:
                  type: integer
                  description: "传输方式：1UDP 2TCP 3HTTP。枚举：1 UDP，2 TCP，3 HTTP"
                  enum:
                    - 1
                    - 2
                    - 3
                  x-apifox-enum:
                    - value: 1
                      name: "UDP"
                      description: "1 表示UDP"
                    - value: 2
                      name: "TCP"
