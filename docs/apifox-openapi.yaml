                  operatorId: admin
                  logContent: 创建采集接口失败
                  logDetail: 操作人：admin；接口名称：遥测接收接口；接口ID：101；结果：创建失败；原因：后台异常
                  logSourceName: 数据采集

  /satellite-management/findData:
    get:
      tags: [卫星目录管理]
      summary: 查询卫星目录管理枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  tableType:
                    - { value: "A", label: "遥测参数表" }
                    - { value: "B", label: "帧结构表" }

  /satellite-management/satellites:
    get:
      tags: [卫星目录管理]
      summary: 查询全部卫星完整配置
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  - name: "试验卫星74"
                    code: "74"
                    enable: true
                    tableA: "74/table/a/遥测参数表.xlsx"
                    tableB: "74/table/b/帧结构表.xlsx"
                    luaPath: "74/lua"
                    tmLen: 1024
                    descrambleRule: { startPos: 4, length: 1020, feedBack: "x^8+x^5+1", initialValue: true }
                    tmChannels:
                      - { name: "遥测通道12", enable: true, channelId: "12", toDescramble: true, tmSyncHead: "1ACFFC1D" }

  /satellite-management/satellites/{code}:
    get:
      tags: [卫星目录管理]
      summary: 查询卫星完整配置详情
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
          example: "74"
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  name: "试验卫星74"
                  code: "74"
                  enable: true
                  tableA: "74/table/a/遥测参数表.xlsx"
                  tableB: "74/table/b/帧结构表.xlsx"
                  luaPath: "74/lua"
                  tmLen: 1024
                  descrambleRule: { startPos: 4, length: 1020, feedBack: "x^8+x^5+1", initialValue: true }
                  tmChannels:
                    - { name: "遥测通道12", enable: true, channelId: "12", toDescramble: true, tmSyncHead: "1ACFFC1D" }
        '404':
          description: 卫星不存在
          content:
            application/json:
              example: { code: 404, message: "未找到指定的卫星配置" }

  /satellite-management/satellites/create:
    post:
      tags: [卫星目录管理]
      summary: 创建卫星完整配置
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SatelliteInfoRequest' }
            example:
              name: "试验卫星74"
              code: "74"
              enable: false
              tableA: ""
              tableB: ""
              luaPath: ""
              tmLen: 1024
              descrambleRule: { startPos: 4, length: 1020, feedBack: "x^8+x^5+1", initialValue: true }
              tmChannels:
                - { name: "遥测通道12", enable: true, channelId: "12", toDescramble: true, tmSyncHead: "1ACFFC1D" }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }
        '400':
          description: 参数或远程业务校验失败
          content:
            application/json:
              example: { code: 400, message: "卫星代号已存在" }

  /satellite-management/satellites/update:
    post:
      tags: [卫星目录管理]
      summary: 整体更新卫星完整配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, info]
              properties:
                code: { type: string, description: "用于定位原卫星的代号" }
                info: { $ref: '#/components/schemas/SatelliteInfoRequest' }
            example:
              code: "74"
              info:
                name: "试验卫星74号"
                code: "074"
                enable: true
                tableA: "74/table/a/遥测参数表.xlsx"
                tableB: "74/table/b/帧结构表.xlsx"
                luaPath: "74/lua"
                tmLen: 1024
                descrambleRule: { startPos: 4, length: 1020, feedBack: "x^8+x^5+1", initialValue: true }
                tmChannels:
                  - { name: "遥测通道12", enable: true, channelId: "12", toDescramble: true, tmSyncHead: "1ACFFC1D" }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }

  /satellite-management/satellites/delete:
    post:
      tags: [卫星目录管理]
      summary: 删除卫星
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "卫星代号" }
            example: { code: "74" }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }

  /satellite-management/satellites/enabled:
    post:
      tags: [卫星目录管理]
      summary: 修改卫星启用状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, enable]
              properties:
                code: { type: string, description: "卫星代号" }
                enable: { type: boolean, description: "是否启用" }
            example: { code: "74", enable: true }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }

  /satellite-management/channels/enabled:
    post:
      tags: [卫星目录管理]
      summary: 修改遥测通道启用状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelEnabledRequest' }
            example: { satelliteCode: "74", channelId: "12", enable: true }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }

  /satellite-management/tables/upload:
    post:
      tags: [卫星目录管理]
      summary: 上传卫星参数表
      description: 文件内容通过gRPC直接转发给卫星管理服务，tableType只能为A或B。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [code, tableType, file]
              properties:
                code: { type: string, description: "卫星代号" }
                tableType: { type: string, enum: [A, B], description: "A为遥测参数表，B为帧结构表" }
                file: { type: string, format: binary, description: "参数表文件" }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功" }
        '400':
          description: 文件校验失败
          content:
            application/json:
              example: { code: 400, message: "参数表类型只能为A或B" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RpcProtocolField:
      type: object
      description: "RPC配置字段；固定字段不可删除或修改标识，自定义字段可增删改；不再使用dataType"
      properties:
        field:
          type: string
          description: "字段标识；固定项为sat_code、channel、data_source，自定义项不能重名"
        fieldName:
          type: string
          description: "字段中文名称；固定项为卫星代号、通道代号、数据源"
        value:
          description: "配置值；前端统一提交字符串，兼容历史数字和布尔值"
          oneOf:
            - type: string
            - type: number
            - type: boolean
          nullable: true
      example:
        field: "sat_code"
        fieldName: "卫星代号"
        value: "SAT-001"
    VisualizationConfigFile:
      type: object
      additionalProperties: false
      description: 可视化页面配置文件；复用现有枚举编码并附中文名称，全部关联使用业务标识，不携带用户、组件、设备或解析配置主键
      required: [schemaVersion, widgets]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
          description: 文件结构版本，目前仅支持第一版
          example: 1
        exportedAt:
          type: string
          format: date-time
          nullable: true
          description: 导出时间，带时区偏移；导入只检查格式，不用于业务匹配
          example: '2026-10-13T09:00:00+08:00'
        widgets:
          type: array
          maxItems: 500
          description: 全部组件，包含隐藏组件；必须显式提供，空数组表示空页面
          items: {$ref: '#/components/schemas/VisualizationConfigWidget'}
    VisualizationConfigWidget:
      type: object
      additionalProperties: false
      required: [widgetKey, widgetType, gridX, gridY, gridWidth, gridHeight, enabled]
      properties:
        widgetKey: {type: string, maxLength: 64, description: 用户任务范围内唯一组件标识, example: temperature-table}
        widgetType:
          type: integer
          description: 复用组件类型枚举编码
          enum: [1, 2, 3, 4, 5]
          x-apifox-enum:
            - {value: 1, label: 实时曲线}
            - {value: 2, label: 实时数据}
            - {value: 3, label: 实时告警}
            - {value: 4, label: 载荷图像}
            - {value: 5, label: 文件表格}
        widgetTypeName: {type: string, readOnly: true, description: 组件类型中文名称，仅展示，导入忽略, example: 实时数据}
        widgetTitle: {type: string, maxLength: 100, nullable: true, description: 组件显示标题, example: 温度表格}
        gridX: {type: integer, minimum: 0, description: 左上角横向网格坐标, example: 0}
        gridY: {type: integer, minimum: 0, description: 左上角纵向网格坐标, example: 0}
        gridWidth: {type: integer, minimum: 1, description: 占用网格列数，沿用现有网格单位, example: 6}
        gridHeight: {type: integer, minimum: 1, description: 占用网格行数，沿用现有网格单位, example: 4}
        enabled:
          type: integer
          description: 显示状态，复用现有枚举
          enum: [0, 1]
          x-apifox-enum:
            - {value: 0, label: 隐藏}
            - {value: 1, label: 显示}
        enabledName: {type: string, readOnly: true, description: 显示状态中文名称，仅展示，导入忽略, example: 显示}
        items:
          type: array
          description: 非遥测数据项，保留各自勾选状态；省略时为空数组，不接受null
          items: {$ref: '#/components/schemas/VisualizationConfigItem'}
        selectedParameters:
          type: array
          description: 仅包含此组件已经勾选的遥测参数；只允许实时曲线及实时数据组件使用，组件内按完整业务标识去重；省略时为空数组，不接受null
          items: {$ref: '#/components/schemas/VisualizationConfigParameter'}
    VisualizationConfigParameter:
      type: object
      additionalProperties: false
      required: [deviceType, deviceCode, telemetryCode]
      properties:
        deviceType:
          type: string
