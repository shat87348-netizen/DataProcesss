openapi: 3.0.3
info:
  title: 数据处理软件接口
  description: |
    data-admin-service 后台管理接口文档。
    查询接口统一使用 GET，写操作统一使用 POST；普通写操作使用 JSON DTO，文件导入使用 multipart/form-data。
    登录成功后，请在 Apifox 中配置 Bearer Token。
    标记为必填的 taskId 必须放在查询参数中，例如 ?taskId=TASK-20260908-001，请替换为实际任务编号；仅放在 JSON 请求体中无效。
    缺少必填请求参数时返回 HTTP 400，例如 {"code":400,"message":"缺少必填请求参数：taskId"}。
    跨域联调：两个服务的 Nacos 配置 auth.allowed-origin-patterns 均设为 ["*"]，允许任意前端来源；同步线上 Nacos 后重启对应服务生效。
    登录预检示例：向 /auth/login 发送 OPTIONS，携带 Origin: http://192.168.112.55:5173、Access-Control-Request-Method: POST 和 Access-Control-Request-Headers: content-type。
    预期返回 HTTP 200，Access-Control-Allow-Origin 回显请求 Origin，Access-Control-Allow-Credentials 为 true；前端来源地址仅为示例，请按实际页面地址替换。
    本地类型示例：300或301在x=100、formulaDesc=y=a*x+b、processParam=0.02/1、decimalPlaces=2时，value为3，valueText为3.00；302按UTF-8解码至valueText，不执行公式；303的value为从2000-01-01 12:00:00起的0.1毫秒整数计数，valueText格式为yyyy-MM-dd HH:mm:ss.SSSS，计数10001对应2000-01-01 12:00:01.0001；不进行时区偏移。
    PDXP本地处理：rpcEnabled=0时，通过protocolConfigId取得configParams.fields，按tableIndex数字升序和bitWidth连续解码并组装遥测Protobuf消息；alarmFlag为1时命中状态范围写正常类型、stateIndex和stateName，未命中只写报警类型。
    通过fields中的参数解析配置id关联当前任务下的设备卫星信息，本地处理不填写satCode，设备名称第一个下划线前后分别写入channelName和bussinessId；Proto的frame_raw_data按data-processing.pdxp配置去掉数据域开头自定义数据和末尾遥测帧头，默认5和4字节，配置0表示没有；传输头默认2字节，也可配置为0或其他长度，PDXP标准包头固定32字节，IoTDB整帧raw则保留完整采集帧及各类头，按小端低位优先读取无符号原始整数x，按formulaType设置valueType：300为FLOAT、301为DOUBLE、302为TEXT、303为TIME，其他类型保留RAW。数值按formulaDesc计算，processParam用斜线分隔并依次绑定a、b等参数，decimalPlaces指定四舍五入小数位数。
    示例：遥测数据为CD AB，三行配置(tableIndex, telemetryCode, bitWidth)为(1, TM001, 3)、(2, TM002, 9)、(3, TM003, 4)，对应原始值为5、377、10，汇总为一帧TelemetryMessage。
    每项Telemetry的table_index取tableIndex、tm_symbol及字典键取telemetryCode；未配置公式类型时value为原始数值、value_text为精确十进制文本、value_type为原码；配置300至303时按对应规则生成物理量或文本，raw_data为低位对齐的小端字段字节。
  version: 2.8.0

servers:
  - url: http://localhost:8082
    description: 数据处理后台服务

tags:
  - name: 总览
  - name: 试验任务
  - name: 登录认证
  - name: 子系统集成
  - name: 用户管理
  - name: 角色管理
  - name: 数据采集
  - name: 数据处理-采集接口同步
  - name: 数据处理-PDXP测试
  - name: 数据处理-FEP测试
  - name: 数据处理-HTTP采集
  - name: 数据可视化
  - name: 数据处理
  - name: 卫星目录管理
  - name: 数据校准
  - name: 告警管理
  - name: 系统日志

paths:
  /rpc-api/knowledge/knowledge/satellite/list:
    get:
      tags: [基线卫星目录]
      summary: 查询基线卫星及通道名称
      description: 采集任务提交前按协议fields中的sat_code查询；RPC返回后按sat_code匹配satelliteCode赋值sat_name，再在该卫星channelList中按channel_code匹配channelCode赋值channel_name。匹配不到或名称为空时保留RPC原值。此接口属于基线服务。
      servers:
        - url: http://10.126.100.249:16001/prod-api
      security: []
      parameters:
        - name: pageNum
          in: query
          required: true
          schema: {type: integer, default: 1}
          example: 1
        - name: pageSize
          in: query
          required: true
          schema: {type: integer, default: 10}
          example: 10
        - name: satelliteCode
          in: query
          required: true
          schema: {type: string}
          example: '111'
      responses:
        '200':
          description: 基线返回的卫星列表
          content:
            application/json:
              example:
                code: 200
                msg: 操作成功
                data:
                  rows:
                    - satelliteCode: '111'
                      satelliteName: XX12卫星
                      channelList:
                        - channelCode: '1111'
                          channelName: '1122'
                        - channelCode: '333'
                          channelName: '222'
  /integration/menu-config:
    get:
      tags: [子系统集成]
      summary: 查询子系统菜单配置
      description: 使用roleIds匹配本地dp_role.baseline_role_id，通过角色菜单关系返回菜单树；不使用统一响应结构，无需登录令牌。
      security: []
      parameters:
        - name: roleIds
          in: query
          required: true
          description: "基线平台角色编号列表，多个编号使用英文逗号分隔"
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
          example: ["20", "21"]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [systemKey, label, icon, baseUrl, origin, menus]
                properties:
                  systemKey:
                    type: string
                    description: "子系统唯一标识"
                  label:
                    type: string
                    description: "子系统显示名称"
                  icon:
                    type: string
                    description: "子系统图标"
                  baseUrl:
                    type: string
                    description: "子系统前端访问根地址"
                  defaultPath:
                    type: string
                    nullable: true
                    description: "默认页面路径"
                  origin:
                    type: string
                    description: "iframe消息来源校验地址"
                  menus:
                    type: array
                    description: "完整菜单树"
                    items:
                      $ref: '#/components/schemas/IntegrationMenuItem'
              example:
                systemKey: "data-processing"
                label: "数据处理软件"
                icon: "system"
                baseUrl: "http://192.168.1.20:8080"
                defaultPath: "/dashboard"
                origin: "http://192.168.1.20:8080"
                menus:
                  - label: "总览"
                    icon: "dashboard"
                    path: "/dashboard"
                  - label: "系统配置"
                    icon: "setting"
                    children:
                      - label: "用户管理"
                        icon: "user"
                        path: "/system/user"

  /processing/device-satellites:
    "get":
      "tags":
        - "数据处理"
      "summary": "查询设备卫星筛选列表"
      "description": "按当前任务查询未删除记录，type不传或为空时查询全部类型；不分页，仅返回id、code、name、type。"
      "parameters":
        -
          "name": "taskId"
          "in": "query"
          "required": true
          "description": "外部试验任务编号，必填"
          "schema":
            "type": "string"
        -
          "name": "type"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "1"
              - "2"
          "description": "可选；1卫星，2设备，不传或为空时查询全部"
      "responses":
        "200":
          "description": "操作成功"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "code":
                    "type": "integer"
                  "message":
                    "type": "string"
                  "data":
                    "type": "array"
                    "items":
                      "type": "object"
                      "properties":
                        "id":
                          "type": "integer"
                          "format": "int64"
                        "code":
                          "type": "string"
                        "name":
                          "type": "string"
                        "type":
                          "type": "string"
                          "enum":
                            - "1"
                            - "2"
              "example":
                "code": 200
                "message": "操作成功"
                "data":
                  -
                    "id": 12
                    "code": "卫星一号"
                    "name": "卫星一号"
                    "type": "1"

  /auth/findData:
    get:
      tags: [登录认证]
      summary: 查询认证模块枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功", data: {} }

  /experiment/tasks/findData:
    get:
      tags: [试验任务]
      summary: 查询试验任务模块枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功", data: { taskStatus: [{ value: 1, label: "运行中" }, { value: 2, label: "已完成" }, { value: 3, label: "已取消" }], endReason: [{ value: "COMPLETED", label: "自然完成" }, { value: "CANCELED", label: "人工停止" }] } }

  /dashboard/findData:
    get:
      tags: [总览]
      summary: 查询首页总览枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  range: [{ value: "3h", label: "近3小时" }, { value: "24h", label: "近24小时" }, { value: "7d", label: "近7天" }]
                  dataType: [{ value: 1, label: "实时遥测" }, { value: 2, label: "延时遥测" }, { value: 3, label: "载荷业务" }]
                  status: [{ value: 0, label: "离线" }, { value: 1, label: "在线" }]

  /system/users/findData:
    get:
      tags: [用户管理]
      summary: 查询用户管理枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example: { code: 200, message: "操作成功", data: { status: [{ value: 0, label: "禁用" }, { value: 1, label: "启用" }] } }

  /system/findData:
    get:
      tags: [角色管理]
      summary: 查询角色和菜单管理枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  status: [{ value: 0, label: "禁用" }, { value: 1, label: "启用" }]

  /collection/findData:
    get:
      tags: [数据采集]
      summary: 查询数据采集枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  interfaceType: [{ value: 1, label: "外部接口" }, { value: 2, label: "内部接口" }]
                  transferType: [{ value: 1, label: "UDP" }, { value: 2, label: "TCP" }, { value: 3, label: "HTTP" }]
                  transferProtocol: [{ value: 1, label: "JSON" }, { value: 2, label: "PDXP" }, { value: 3, label: "FEP" }]
                  protocolType: [{ value: 1, label: "JSON" }, { value: 2, label: "PDXP" }, { value: 3, label: "Protobuf" }, { value: 4, label: "RPC" }]
                  status: [{ value: 0, label: "离线" }, { value: 1, label: "在线" }]
                  enabled: [{ value: 0, label: "禁用" }, { value: 1, label: "启用" }]

  /visualization/findData:
    get:
      tags: [数据可视化]
      summary: 查询数据可视化枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  widgetType: [{ value: 1, label: "实时曲线" }, { value: 2, label: "实时数据" }, { value: 3, label: "实时告警" }, { value: 4, label: "载荷图像" }, { value: 5, label: "文件表格" }]
                  enabled: [{ value: 0, label: "隐藏" }, { value: 1, label: "显示" }]
                  isSelected: [{ value: 0, label: "未选中" }, { value: 1, label: "已选中" }]
                  selectionType: [{ value: 1, label: "处理后数据表格" }, { value: 2, label: "处理后数据曲线" }, { value: 3, label: "数据可视化表格" }, { value: 4, label: "数据可视化曲线" }]

  /processing/findData:
    get:
      tags:
      - 数据处理
      summary: 查询数据处理枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: 操作成功
                data:
                  taskStatus:
                  - value: 0
                    label: 等待中
                  - value: 1
                    label: 运行中
                  - value: 2
                    label: 已完成
                  ruleEnabled:
                  - value: 0
                    label: 禁用
                  - value: 1
                    label: 启用
                  storeFlag:
                  - value: 0
                    label: 否
                  - value: 1
                    label: 是
                  selectionType:
                  - value: 1
                    label: 处理后数据表格
                  - value: 2
                    label: 处理后数据曲线
                  - value: 3
                    label: 数据可视化表格
                  - value: 4
                    label: 数据可视化曲线

  /calibration/findData:
    get:
      tags: [数据校准]
      summary: 查询数据校准枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              example:
                code: 200
                message: "操作成功"
                data:
                  detectMethod: [{ value: 1, label: "莱特准则" }, { value: 2, label: "阈值法" }, { value: 3, label: "肖维涅法" }]
                  dynamicUpdate: [{ value: 0, label: "否" }, { value: 1, label: "是" }]
                  autoClean: [{ value: 0, label: "否" }, { value: 1, label: "是" }]
                  enabled: [{ value: 0, label: "禁用" }, { value: 1, label: "启用" }]
                  isOutlier: [{ value: 0, label: "否" }, { value: 1, label: "是" }]

  /alarms/findData:
    get:
      tags:
      - 告警管理
      summary: 查询告警管理枚举
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码
                  message:
                    type: string
                    description: 中文结果说明
                  data:
                    type: object
                    properties:
                      dataAlarmSource:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      dataAlarmEventType:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      dataAlarmLevel:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      dataAlarmStatus:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      systemAlarmLevel:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      systemAlarmStatus:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      serviceStatus:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      metricCode:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      heartbeatStatus:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      changeType:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      systemAlarmType:
                        type: array
                        description: 系统告警类型编码和中文名称，复用监测指标枚举
                        items:
                          $ref: '#/components/schemas/EnumOption'
              example:
                code: 200
                message: 操作成功
                data:
                  dataAlarmSource:
                  - value: COLLECTION
                    label: 数据采集
                  - value: PROCESSING
                    label: 数据处理
                  - value: CALIBRATION
                    label: 数据校准
                  dataAlarmEventType:
                  - value: INTERFACE_SYNC
                    label: 采集运行状态同步失败
                  - value: INTERFACE_START
                    label: 接口启动失败
                  - value: INTERFACE_STOP
                    label: 采集接口停止接收
                  - value: COLLECTION_RECEIVE
                    label: 接口接收异常
                  - value: PACKET_PARSE
                    label: 报文解析失败
                  - value: FILE_RECEIVE
                    label: 文件接收失败
                  - value: PROCESS_QUEUE
                    label: 处理队列已满
                  - value: PROCESS_CONFIG
                    label: 参数处理失败
                  - value: RPC_FAILURE
                    label: 远程处理失败
                  - value: PARAMETER_RANGE
                    label: 遥测参数越限
                  - value: STORAGE_FAILURE
                    label: 数据存储失败
                  - value: MESSAGE_FAILURE
                    label: 结果消息发送失败
                  - value: FILE_RESULT
                    label: 文件结果处理失败
                  - value: CALIBRATION_OUTLIER
                    label: 校准野值
                  - value: CALIBRATION_RULE
                    label: 校准规则异常
                  - value: CALIBRATION_CACHE
                    label: 校准缓存失败
                  - value: CALIBRATION_PERSIST
                    label: 校准记录落库失败
                  dataAlarmLevel:
                  - value: 2
                    label: 一般
                  - value: 4
                    label: 严重
                  dataAlarmStatus:
                  - value: 0
                    label: 未处理
                  - value: 1
                    label: 已处理
                  systemAlarmLevel:
                  - value: 2
                    label: 一般
                  - value: 3
                    label: 严重
                  systemAlarmStatus:
                  - value: 0
                    label: 未恢复
                  - value: 1
                    label: 已恢复
                  serviceStatus:
                  - value: RUNNING
                    label: 运行中
                  - value: DOWN
                    label: 停止
                  - value: ERROR
                    label: 查询异常
                  metricCode:
                  - value: cpu_usage
                    label: CPU使用率
                  - value: memory_usage
                    label: 内存使用率
                  - value: disk_usage
                    label: 磁盘使用率
                  - value: queue_depth
                    label: 消息积压数量
                  heartbeatStatus:
                  - value: NORMAL
                    label: 正常
                  - value: WAITING
                    label: 等待心跳
                  changeType:
                  - value: CREATED
                    label: 新增
                  - value: UPDATED
                    label: 持续触发
                  - value: RECOVERED
                    label: 已恢复
                  systemAlarmType:
                  - value: cpu_usage
                    label: CPU使用率
                  - value: memory_usage
                    label: 内存使用率
                  - value: disk_usage
                    label: 磁盘使用率
                  - value: queue_depth
                    label: 消息积压数量

  /system/logs/findData:
    get:
      tags:
      - 系统日志
      summary: 查询系统日志枚举
      description: 返回日志级别和全部固定业务来源。英文value用于数据库录入和来源筛选，中文label仅用于展示；选项不依赖任务或已有日志。
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码
                  message:
                    type: string
                    description: 中文结果说明
                  data:
                    type: object
                    properties:
                      logLevel:
                        type: array
                        items:
                          $ref: '#/components/schemas/EnumOption'
                      logSource:
                        type: array
                        description: 固定日志来源，英文value用于录入和筛选，中文label用于展示
                        items:
                          $ref: '#/components/schemas/EnumOption'
              example:
                code: 200
                message: 操作成功
                data:
                  logLevel:
                  - value: INFO
                    label: 信息
                  - value: WARN
                    label: 警告
                  - value: ERROR
                    label: 错误
                  logSource:
                  - value: COLLECTION
                    label: 数据采集
                  - value: PROCESSING
                    label: 数据处理
                  - value: CALIBRATION
                    label: 数据校准
                  - value: VISUALIZATION
                    label: 数据可视化
                  - value: TELEMETRY_FILTER
                    label: 遥测参数筛选
                  - value: ALARM_MANAGEMENT
                    label: 告警管理
                  - value: USER_MANAGEMENT
                    label: 用户管理
                  - value: ROLE_MANAGEMENT
                    label: 角色管理
                  - value: SATELLITE_CATALOG
                    label: 卫星目录
                  - value: AUTHENTICATION
                    label: 用户认证

  /experiment/tasks:
    get:
      tags: [试验任务]
      summary: 查询全部试验任务
      description: 返回调度系统通过RocketMQ下发的试验任务生命周期快照，直接使用外部taskId作为任务主键。
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, description: "业务状态码" }
                  message: { type: string, description: "处理结果" }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string, description: "外部试验任务编号" }
                        requirementId: { type: string, description: "关联需求业务编号" }
                        taskName: { type: string, description: "试验任务名称" }
                        taskPriority: { type: integer, description: "任务优先级" }
                        planId: { type: string, description: "试验方案内部编号" }
