  /visualization/config/export:
    get:
      tags: [数据可视化]
      summary: 导出当前用户整页可视化配置
      description: 下载JSON配置文件，包含隐藏组件、网格布局、每个组件已勾选的遥测参数及已有数据项。未勾选遥测参数、实时数值、告警记录和文件实体不导出；文件不包含源数据库主键。成功响应为配置文件本身，不包裹code/message/data。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      responses:
        '200':
          description: 可重新导入的JSON配置附件，最大10MB
          headers:
            Content-Disposition:
              description: 附件下载及UTF-8文件名
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VisualizationConfigFile'}
        '400':
          description: 任务无效、组件配置不合法、关联失效或文件超过限制；统一返回中文错误信息

  /visualization/config/import/preview:
    post:
      tags: [数据可视化]
      summary: 检查可视化配置导入文件
      description: 只读检查文件结构以及目标任务的参数、采集接口和协议关联。valid=false时展示errors，不允许导入；最多返回100条中文问题。当前登录用户由令牌确定。文件最多500个组件，参数勾选与数据项合计最多50000条。任务无效、空文件或超过10MB返回错误响应。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 本系统导出的.json配置文件，最大10MB
      responses:
        '200':
          $ref: '#/components/responses/VisualizationConfigCheckSuccess'
        '400':
          description: 必填参数缺失、任务无效、空文件或超大文件

  /visualization/config/import:
    post:
      tags: [数据可视化]
      summary: 事务替换当前用户整页可视化配置
      description: 上传检查时的同一文件，服务端在任务锁内重新检查。按设备卫星类型、编码和遥测代号匹配有效参数，接口和协议按目标任务内唯一名称匹配；任意缺失、重名或非法配置均阻止导入。全部通过后只替换当前用户目标任务的组件、数据项和组件勾选，生成新组件主键；任何异常整体回滚。显式widgets空数组表示清空当前用户目标任务页面，须由前端明确提示。成功后重新加载组件列表和筛选树，旧组件主键失效。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 检查时使用的同一.json配置文件，最大10MB；必须重新上传文件
      responses:
        '200':
          $ref: '#/components/responses/VisualizationConfigCheckSuccess'
        '400':
          description: 校验或关联匹配失败，原页面配置保持完整；统一返回中文错误信息

