                        - value: CALIBRATION
                          label: 数据校准
                        - value: VISUALIZATION
                          label: 数据可视化
                        - value: TELEMETRY_FILTER
                          label: 遥测参数筛选
                        - value: ALARM_MANAGEMENT
                          label: 告警管理
                        - value: USER_MANAGEMENT
                          label: 用户管理
