                  description: "业务数据主键 ID"
                  format: int64
                taskId:
                  type: string
                  description: "接口原所属试验任务编号，修改时必须保持不变"
                interfaceName:
                  type: string
                  description: "采集接口名称"
                interfaceType:
                  type: integer
                  description: "接口类型：1外部接口 2内部接口。枚举：1 外部接口，2 内部接口"
                  enum:
                    - 1
                    - 2
                  x-apifox-enum:
                    - value: 1
                      name: "外部接口"
                      description: "1 表示外部接口"
                    - value: 2
                      name: "内部接口"
                      description: "2 表示内部接口"
                sendFrom:
                  type: string
                  description: "数据发送来源"
                messageContent:
                  type: string
                  description: "采集消息内容或格式说明"
                transferType:
                  type: integer
                  description: "传输方式：1UDP 2TCP 3HTTP。枚举：1 UDP，2 TCP，3 HTTP"
                  enum:
                    - 1
                    - 2
                    - 3
                  x-apifox-enum:
                    - value: 1
                      name: "UDP"
                      description: "1 表示UDP"
                    - value: 2
                      name: "TCP"
                      description: "2 表示TCP"
                    - value: 3
                      name: "HTTP"
                      description: "3 表示HTTP"
                transferProtocol:
                  type: integer
                  description: "传输协议：1JSON 2PDXP 3FEP"
                  enum: [1, 2, 3]
                  x-apifox-enum:
                    - value: 1
                      name: "JSON"
                      description: "1 表示JSON"
                    - value: 2
                      name: "PDXP"
                      description: "2 表示PDXP"
                    - value: 3
                      name: "FEP"
                      description: "3 表示FEP"
                protocolConfigId:
                  type: integer
                  nullable: true
                  description: "HTTP必选当前任务的已启用JSON配置；FEP省略且保存为空；其他协议处理选PDXP、转发选RPC"
                  format: int64
                host:
                  type: string
                  description: "UDP/TCP本机监听地址；HTTP对外接收IP或域名，不包含访问协议、路径、端口，不允许通配地址"
                port:
                  type: integer
                  description: "UDP/TCP本机监听端口；HTTP对外接收端口，范围1到65535"
                receivePath:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: "HTTP必填，以/collection/receive/开头，路径区分大小写；其他传输方式保存为空"
                multicastIp:
                  type: string
                  nullable: true
                  description: "UDP组播地址；填写时按组播接收，为空时按单播接收"

                enabled:
                  type: integer
                  description: "是否启用通道：0否 1是。枚举：0 禁用，1 启用"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "禁用"
                      description: "0 表示禁用"
                    - value: 1
                      name: "启用"
                      description: "1 表示启用"
                rpcEnabled:
                  type: integer
                  nullable: true
                  description: "HTTP和FEP省略且固定保存0；其他协议0处理（选PDXP）、1转发（选RPC），默认0"
                  enum:
                    - 0
                    - 1
                  x-apifox-enum:
                    - value: 0
                      name: "禁用"
                      description: "0 表示不使用RPC处理"
                    - value: 1
                      name: "启用"
                      description: "1 表示使用RPC处理"
                remark:
                  type: string
                  description: "备注信息"
            examples:
              rpc:
                summary: RPC处理
                value:
                  id: 11
