  /collection/interfaces/delete:
    post:
      tags: [数据采集]
      summary: 删除采集接口
      description: '只允许删除已经禁用的采集接口；启用中的接口需要先禁用。删除成功后同步全部启用接口。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: "业务数据主键 ID"
                  format: int64
            example:
              id: 11
      responses:
        '200':
