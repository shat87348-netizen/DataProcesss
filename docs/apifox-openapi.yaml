                    - value: 1
                      name: "启用"
                      description: "1 表示启用"
            example:
              id: 11
              enabled: 1
      responses:
        '200':
          $ref: '#/components/responses/Success027'

  /collection/receive/{receivePath}:
    post:
      tags: [数据处理-HTTP采集]
      summary: 统一接收HTTP采集JSON并返回成功
      description: '处理服务实际匹配POST /collection/receive/**，所有子路径共用一个Controller。receivePath为前缀后的路径名称，也支持多级路径，联调多级路径时直接编辑请求URL。当前仅由框架解析JSON并返回成功，不查询采集配置，不检查任务、接口启用状态或协议配置，不入库、不发布消息、不统计；成功仅表示请求已到达入口且JSON可解析。沿用处理服务现有鉴权开关与白名单，未豁免时携带Bearer Token。'
      servers:
        - url: http://localhost:8083
          description: 数据处理服务，按实际部署地址替换
      parameters:
        - name: receivePath
          in: path
          required: true
          description: 接收前缀后的路径，例如telemetry或status，不要求已创建对应采集配置
          schema: { type: string }
          example: telemetry
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
            examples:
              object:
                summary: JSON对象，业务字段暂不固定
                value:
                  source: "测试发送端"
                  payload: { value: 123 }
              array:
                summary: JSON数组，同样只确认收到请求
                value: [{ value: 123 }, { value: 456 }]
      responses:
        '200':
          description: 已接收JSON，不代表业务处理或入库完成
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: integer, enum: [200] }
                  message: { type: string }
              example: { code: 200, message: "操作成功" }
        '400':
          description: 请求体缺失或JSON无法解析
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [400] }
                  message: { type: string }
              example: { code: 400, message: "请求体必须是非空的合法JSON" }
        '401':
          description: 沿用现有鉴权规则，未提供有效登录令牌
        '405':
          description: 仅支持POST请求
        '415':
          description: 请求类型必须是application/json

  /internal/collection/interfaces/sync:
    post:
      tags:
      - 数据处理-采集接口同步
      summary: 通知数据处理服务同步采集接口
      description: Admin传入当前应该运行的完整采集接口ID列表；空列表表示停止全部采集接口。数据处理服务按ID自行查询host、port、rpc_enabled及协议配置。 返回data为实际完成端口绑定并成功提交采集任务的运行接口ID列表；启用配置成功不等于采集接口启动。
      security: []
      servers:
      - url: http://localhost:8083
        description: 数据处理服务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - interfaceIds
              properties:
                interfaceIds:
                  type: array
                  description: 当前应该运行的完整采集接口主键列表
                  maxItems: 1000
                  items:
                    type: integer
                    format: int64
            example:
              interfaceIds:
              - 11
              - 12
              - 13
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 业务状态码
                  message:
                    type: string
                    description: 中文结果说明
                  data:
                    type: array
                    items:
                      type: integer
                      description: 端口绑定成功且任务仍运行的接口ID
                      format: int64
              example:
                code: 200
                message: 操作成功
                data:
                - 11
                - 12

