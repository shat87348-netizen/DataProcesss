            senderName: { type: string, description: "发送方名称；当前未知时为空字符串" }
            receiverId: { type: string, description: "接收方编号；当前未知时为空字符串" }
            receiverName: { type: string, description: "接收方名称；当前未知时为空字符串" }
            time: { type: string, description: "文件接收完成时间，精确到毫秒", example: "2026-09-02 16:35:28.123" }
      example:
        requirementId: ""
