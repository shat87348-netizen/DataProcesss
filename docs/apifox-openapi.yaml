                  description: "外部试验任务编号"
                configName:
                  type: string
                  description: "协议配置名称"
                protocolType:
                  type: integer
                  description: "协议类型：1JSON 2PDXP 3Protobuf 4RPC。枚举：1 JSON，2 PDXP，3 Protobuf，4 RPC"
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  x-apifox-enum:
                    - value: 1
                      name: "JSON"
                      description: "1 表示JSON"
                    - value: 2
                      name: "PDXP"
                      description: "2 表示PDXP"
                    - value: 3
                      name: "Protobuf"
                      description: "3 表示Protobuf"
                    - value: 4
                      name: "RPC"
                      description: "4 表示RPC"
                configDesc:
                  type: string
                  description: "协议配置说明"
