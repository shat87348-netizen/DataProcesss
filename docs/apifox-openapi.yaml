        itemName: {type: string, maxLength: 100, description: 已持久化数据项名称, example: 温度}
        selected: {type: boolean, description: 非遥测数据项保留原状态；已勾选参数下固定为true, example: true}
        interfaceName: {type: string, maxLength: 100, nullable: true, description: 可选采集接口名称；目标任务内必须恰好匹配一条有效记录，省略表示无关联}
        protocolConfigName: {type: string, maxLength: 100, nullable: true, description: 可选协议配置名称；目标任务内必须恰好匹配一条有效记录，省略表示无关联}
