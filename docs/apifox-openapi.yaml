  /processing/overview:
    get:
      tags: [数据处理]
      summary: 查询数据处理统计总览
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      responses:
        '200':
          $ref: '#/components/responses/Success048'

  /processing/realtime:
    get:
      tags: [数据处理]
      summary: 查询实时处理监控
      description: 查询当前任务下所有接口的PDXP帧处理速率之和，各接口按业务处理完成且IoTDB与MQ异步任务均提交成功的帧数除以实际采样秒数计算，不代表异步入库或消息发送成功；CPU和物理内存复用系统告警的管理服务所在机器采集逻辑。三个字段均直接包含展示单位，处理速率最多保留两位小数。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
      responses:
        '200':
          $ref: '#/components/responses/Success049'

  /processing/collect-interfaces:
    get:
      tags: [数据处理]
      summary: 查询已启用采集接口筛选项
      description: 只查询已启用且未删除的采集接口，页面展示接口名称并使用接口主键筛选遥测数据。
      responses:
        '200':
          $ref: '#/components/responses/EnabledCollectInterfaceOptions'

  /processing/realtime/telemetry:
    get:
      tags: [数据处理]
      summary: 查询实时遥测数据
      description: "查询IoTDB整帧，包括正常处理结果及本地参数解析失败时保存的完整异常帧。RPC的frame_check_status=false写异常，true写正常；本地成功解析写正常。本地参数解析失败只保存异常整帧，不写参数、不发布消息，前提是PDXP包、数据域及任务设备通道身份完整。"
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: interfaceId
          in: query
          required: false
          description: 采集接口主键，必须大于零；不传时查询当前任务全部本地及RPC整帧，包含无接口层级的旧记录。传入时只查询对应interface_节点，不推断旧记录的来源。
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/IoTDBPageSize'
      responses:
        '200':
          $ref: '#/components/responses/RealtimeTelemetryList'

  /processing/realtime/invalid:
    get:
      tags: [数据处理]
      summary: 查询帧检查异常数据
      description: "仅查询checkResultName不为正常的整帧，包含RPC帧检查失败及已入库的本地参数解析失败帧；缺少有效身份或无法正确拆分数据域的报文不会按此结构入库。历史非正常名称仍可查出。"
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: interfaceId
          in: query
          required: false
          description: 采集接口主键，必须大于零；不传时查询当前任务全部本地及RPC整帧，包含无接口层级的旧记录。传入时只查询对应interface_节点，不推断旧记录的来源。
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/IoTDBPageSize'
      responses:
        '200':
          $ref: '#/components/responses/InvalidTelemetryList'

  /processing/processed:
    get:
      tags: [数据处理]
      summary: 查询处理后遥测参数最新数据
      description: 按表格场景查询已保存勾选参数的最新值，设备按当前taskId、勾选记录的设备主键和遥测代号查询device_路径；卫星按当前taskId、rpc_开头的身份节点和遥测代号查询，不用卫星资料主键拼接存储路径。设备卫星类型由已勾选参数所属资料读取，前端不新增类型入参。同一代号存在多个路径时按时间取最新一条。筛选树、勾选保存、返回字段及默认场景不变。数据可视化表格传selectionType=3及组件主键targetId。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: selectionType
          in: query
          required: false
          description: "勾选场景：1处理后数据表格，3数据可视化表格；默认1。查询该场景及目标下已保存的参数勾选。"
          schema:
            type: integer
            enum: [1, 3]
            default: 1
            x-apifox-enum:
              - value: 1
                name: "处理后数据表格"
                description: "处理后数据表格的参数勾选，targetId必须为0"
              - value: 3
                name: "数据可视化表格"
                description: "数据可视化表格的参数勾选，targetId为对应组件的widgetId"
        - name: targetId
          in: query
          required: false
          description: "勾选目标主键：selectionType=1时必须为0；selectionType=3时填写当前任务、当前用户的数据可视化表格组件widgetId，组件类型必须为实时数据。不是设备卫星ID或参数解析配置ID。"
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          $ref: '#/components/responses/ProcessedTelemetryList'

  /processing/processed/curve:
    get:
      tags: [数据处理]
      summary: 查询处理后遥测参数最近曲线
      description: 按曲线场景读取已保存勾选参数，设备按当前taskId、设备主键和遥测代号查询device_路径；卫星按当前taskId、rpc_开头身份和遥测代号查询，类型从已勾选参数所属资料读取。多个匹配路径统一按时间取最近最多120个有效点，再按时间升序返回。设备卫星按各自身份范围查询，筛选树、勾选保存及返回字段不变。默认处理后数据曲线，可视化曲线传selectionType=4及组件主键targetId，各曲线携带自己的毫秒时间戳数组。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: selectionType
          in: query
          required: false
          description: "勾选场景：2处理后数据曲线，4数据可视化曲线；默认2。查询该场景及目标下已保存的参数勾选。"
          schema:
            type: integer
            enum: [2, 4]
            default: 2
            x-apifox-enum:
              - value: 2
                name: "处理后数据曲线"
                description: "处理后数据曲线的参数勾选，targetId必须为0"
              - value: 4
                name: "数据可视化曲线"
                description: "数据可视化曲线的参数勾选，targetId为对应组件的widgetId"
        - name: targetId
          in: query
          required: false
          description: "勾选目标主键：selectionType=2时必须为0；selectionType=4时填写当前任务、当前用户的数据可视化曲线组件widgetId，组件类型必须为实时曲线。不是设备卫星ID或参数解析配置ID。"
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          $ref: '#/components/responses/ProcessedTelemetryCurveList'

  /processing/rule-config:
    get:
      tags: [数据处理]
      summary: 查询处理规则配置
      description: 只查询参数值范围检查开关；如果任务尚无配置，则先插入关闭状态的默认配置。
      parameters:
        - name: taskId
          in: query
          required: true
          schema: { type: string }
          example: TASK-20260908-001
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRuleConfigResponse'
              example:
                code: 200
                message: "操作成功"
                data:
                  parameterRangeCheckEnabled: 1

  /processing/rule-config/update:
    post:
      tags: [数据处理]
      summary: 保存处理规则配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, parameterRangeCheckEnabled]
              properties:
                taskId:
                  type: string
                  description: "外部试验任务编号"
                parameterRangeCheckEnabled:
                  type: integer
                  description: "参数值范围检查开关"
                  enum: [0, 1]
                  x-apifox-enum:
                    - value: 0
                      name: "关闭"
                      description: "0表示关闭"
                    - value: 1
                      name: "开启"
                      description: "1表示开启"
            example:
              taskId: "TASK-20260908-001"
              parameterRangeCheckEnabled: 1
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingRuleConfigResponse'

  /processing/systems:
    get:
      tags: [数据处理]
      summary: 查询设备卫星的所属系统
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: deviceSatelliteId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        systemName: { type: string }
                        parentId: { type: integer, format: int64 }
                        sortOrder: { type: integer }
                        children:
                          type: array
                          description: 有子系统时才返回
                          items: { type: object }
              example:
                code: 200
                message: 操作成功
                data:
                  - id: 21
                    systemName: 测控系统
                    parentId: 0
                    sortOrder: 1
                    children:
                      - id: 22
                        systemName: 姿态控制
                        parentId: 21
                        sortOrder: 2

  /processing/telemetry-filter-tree:
    get:
      tags: [数据处理]
      summary: 按需展开遥测参数筛选树
      description: 必须传taskId、selectionType和targetId以确定独立的勾选场景。仅传这三个参数返回设备；增加deviceSatelliteId返回直属参数和根系统；同时增加systemId返回该系统直属参数和子系统。传非空telemetryCode时按完整代号精确查询当前任务全部匹配的参数，直接返回可勾选节点和所属设备；此时不能传deviceSatelliteId或systemId。接口不分页，且不返回children字段。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: selectionType
          in: query
          required: true
          description: "勾选场景：1处理后数据表格，2处理后数据曲线，3数据可视化表格，4数据可视化曲线。决定返回哪个场景下的checked勾选状态。"
          schema:
            type: integer
            enum: [1, 2, 3, 4]
            x-apifox-enum:
              - value: 1
                name: "处理后数据表格"
                description: "处理后数据表格的参数勾选，targetId必须为0"
              - value: 2
                name: "处理后数据曲线"
                description: "处理后数据曲线的参数勾选，targetId必须为0"
              - value: 3
                name: "数据可视化表格"
                description: "数据可视化表格的参数勾选，targetId为对应组件的widgetId"
              - value: 4
                name: "数据可视化曲线"
                description: "数据可视化曲线的参数勾选，targetId为对应组件的widgetId"
        - name: targetId
          in: query
          required: true
          description: "勾选目标主键：selectionType为1或2时必须填0；为3或4时填写当前任务、当前用户的对应组件widgetId，3对应实时数据组件，4对应实时曲线组件。不同组件分别保存勾选。"
          schema: { type: integer, format: int64 }
        - name: deviceSatelliteId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: systemId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: telemetryCode
          in: query
          required: false
          description: 完整遥测代号，精确匹配；传入非空值时不能同时传deviceSatelliteId或systemId，返回全部匹配参数
          schema: { type: string }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        label: { type: string }
                        nodeType: { type: string, enum: [device, system, parameter] }
                        nodeTypeName: { type: string }
                        selectable: { type: boolean }
                        checked: { type: boolean }
                        hasChildren: { type: boolean }
                        deviceSatelliteId: { type: integer, format: int64, description: "搜索结果所属设备卫星主键" }
                        deviceSatelliteName: { type: string, description: "搜索结果所属设备卫星名称" }
                        systemName: { type: string, description: "搜索结果所属系统完整路径，未分类时不返回" }
              examples:
                expand:
                  summary: 展开设备层级
                  value:
                    code: 200
                    message: 操作成功
                    data:
                      - id: 81
                        label: 电压/TMK1001
                        nodeType: parameter
                        nodeTypeName: 遥测参数
                        selectable: true
                        checked: true
                        hasChildren: false
                      - id: 21
                        label: 测控系统
                        nodeType: system
                        nodeTypeName: 所属系统
                        selectable: false
                        checked: false
                        hasChildren: true
                search:
                  summary: 按遥测代号搜索
                  value:
                    code: 200
                    message: 操作成功
                    data:
                      - id: 81
                        label: 电压/TMK1001
                        nodeType: parameter
                        nodeTypeName: 遥测参数
                        selectable: true
                        checked: true
                        hasChildren: false
                        deviceSatelliteId: 12
                        deviceSatelliteName: XX12卫星
                        systemName: '测控系统\姿态控制'
        '400':
          description: 遥测代号搜索与设备或系统展开参数不能同时使用
          content:
            application/json:
              example:
                code: 400
                message: 按遥测代号搜索时不能同时指定设备卫星或所属系统

  /processing/telemetry-filter-selection/update:
    post:
      tags: [数据处理]
      summary: 即时保存遥测参数勾选状态
      description: "勾选或取消时立即保存，按taskId、selectionType、targetId隔离。设备卫星主键和遥测代号由parseRuleId对应的有效参数解析配置确定，无需单独提交；取消勾选采用逻辑删除。筛选树与后续数据查询必须使用相同的场景和目标。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, parseRuleId, checked, selectionType, targetId]
              properties:
                taskId:
                  type: string
                  description: "当前试验任务编号，参数必须属于该任务。"
                parseRuleId:
                  type: integer
                  format: int64
                  description: "参数解析配置主键，使用筛选树中遥测参数节点的id；不是设备卫星ID、所属系统ID或遥测代号。"
                checked:
                  type: boolean
                  description: "勾选状态：true表示勾选，false表示取消勾选；只有遥测参数节点可以勾选。"
                selectionType:
                  type: integer
                  description: "勾选场景：1处理后数据表格，2处理后数据曲线，3数据可视化表格，4数据可视化曲线。各场景的参数勾选分别保存。"
                  enum: [1, 2, 3, 4]
                  x-apifox-enum:
                    - value: 1
                      name: "处理后数据表格"
                      description: "处理后数据表格的参数勾选，targetId必须为0"
                    - value: 2
                      name: "处理后数据曲线"
                      description: "处理后数据曲线的参数勾选，targetId必须为0"
                    - value: 3
                      name: "数据可视化表格"
                      description: "数据可视化表格的参数勾选，targetId为对应组件的widgetId"
                    - value: 4
                      name: "数据可视化曲线"
                      description: "数据可视化曲线的参数勾选，targetId为对应组件的widgetId"
                targetId:
                  type: integer
                  format: int64
                  description: "勾选目标主键：selectionType为1或2时必须填0；为3或4时填写当前任务、当前用户的对应组件widgetId，3对应实时数据组件，4对应实时曲线组件。不是设备卫星ID或参数解析配置ID。"
            example: { taskId: TASK-20260908-001, parseRuleId: 81, checked: true, selectionType: 3, targetId: 205 }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data: { type: boolean }
              example: { code: 200, message: 操作成功, data: true }

  /processing/rules:
    get:
      tags: [数据处理]
      summary: 分页查询参数解析配置
      description: 按当前任务和设备卫星分页查询有效参数；不传systemId时查询当前设备全部参数，传入时仅查询该系统直属参数，不包含子系统参数。分页总数与列表使用相同筛选条件。
      parameters:
        - $ref: '#/components/parameters/RequiredTaskId'
        - name: deviceSatelliteId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: systemId
          in: query
          required: false
          description: 所属系统主键；点击系统节点时传入，只查询该节点直属参数；点击设备节点时不传，查询当前设备全部参数。
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/IoTDBPageSize'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      pageNum: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer, format: int64 }
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer, format: int64 }
                            taskId: { type: string }
                            deviceSatelliteId: { type: integer, format: int64 }
                            systemId: { type: integer, format: int64, nullable: true }
                            systemName: { type: string, nullable: true }
                            tableIndex: { type: string }
                            bitWidth: { type: string }
                            telemetryName: { type: string }
                            telemetryCode: { type: string }
